name: harafi
description: "خدمات منزلية — كفر الزيات - Flutter Web platform for home services"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.3
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.7.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.20.2
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  flutter_web_plugins:
    sdk: flutter
  shared_preferences: ^2.3.5
  audioplayers: ^6.1.0
  image_picker: ^1.1.2
  fl_chart: ^0.71.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo2.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo2.png"
    background_color: "#090D16"
    theme_color: "#E2B23B"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/

